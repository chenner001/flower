<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈洛 - 微博</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        /* 顶部导航 */
        .top {
            background: #e6162d;
            color: white;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .top-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .search {
            background: white;
            border-radius: 20px;
            padding: 6px 15px;
            width: 280px;
            font-size: 14px;
            color: #666;
        }

        /* 个人主页头部 */
        .profile {
            background: white;
            padding: 30px 0;
            margin-bottom: 20px;
        }

        .profile-card {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #eee;
            object-fit: cover;
        }

        .info h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #333;
        }

        .info p {
            color: #666;
            font-size: 15px;
        }

        /* 动态列表 */
        .post {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 15px;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .post-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #eee;
        }

        .post-name {
            font-weight: bold;
            color: #333;
        }

        .post-loc {
            font-size: 13px;
            color: #888;
            margin-left: 8px;
        }

        .post-text {
            font-size: 16px;
            line-height: 1.7;
            color: #333;
            margin-bottom: 18px;
        }

        .post-img {
            width: 100%;
            max-width: 450px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        /* 评论区 */
        .comment {
            border-top: 1px solid #f0f0f0;
            padding-top: 18px;
            margin-top: 10px;
        }

        .comment-item {
            margin-bottom: 14px;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }

        .comment-me {
            color: #e6162d;
        }

        .witness {
            color: #d82c2c;
        }

        .highlight {
            font-weight: bold;
            color: #000;
        }
    </style>
</head>

<body>

    <!-- 顶部 -->
    <div class="top">
        <div class="container top-inner">
            <div class="logo">微博</div>
            <div class="search">搜索微博、用户、新闻</div>
        </div>
    </div>

    <!-- 个人主页 -->
    <div class="profile">
        <div class="container">
            <div class="profile-card">
                <img src="chenluo.jpg" class="avatar" alt="陈洛头像">
                <div class="info">
                    <h2>陈洛</h2>
                    <p>望月大学 摄影系学生</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 内容区 -->
    <div class="container">
        <!-- 最后一条动态（核心剧情） -->
        <div class="post">
            <div class="post-header">
                <img src="chenluo.jpg" class="post-avatar" alt="头像">
                <div>
                    <span class="post-name">陈洛</span>
                    <span class="post-loc">📍 落花神社</span>
                </div>
            </div>

            <div class="post-text">
                这里的红叶真的很美，但神社里有个地方不让拍照，好神秘。
            </div>

            <img src="fengye.jpg" class="post-img" alt="枫叶照">

            <!-- 评论区（隐藏用户名） -->
            <div class="comment">
                <div class="comment-item">洛哥，你没事吧？电话打不通。</div>
                <div class="comment-item comment-me">信号不好，明天回。</div>
                <br>
                <div class="comment-item witness">
                    我好像看到这个人被一个<strong class="highlight">黑衣女人</strong>带往后山了。
                </div>
                <div class="comment-item witness">
                    <strong class="highlight">黑衣女人</strong>头发很长，脸上涂白粉，像能剧面具。她拉着他的手，他表情恍惚。
                </div>
            </div>
        </div>

        <!-- 日常动态 1 -->
        <div class="post">
            <div class="post-header">
                <img src="chenluo.jpg" class="post-avatar" alt="头像">
                <span class="post-name">陈洛</span>
            </div>
            <div class="post-text">
                今天上课拍了一组校园光影，老师说构图进步很大。
            </div>
        </div>

        <!-- 日常动态 2 -->
        <div class="post">
            <div class="post-header">
                <img src="chenluo.jpg" class="post-avatar" alt="头像">
                <span class="post-name">陈洛</span>
            </div>
            <div class="post-text">
                周末打算去山里采风，有没有推荐的取景地？
            </div>
        </div>
    </div>

</body>
</html>
