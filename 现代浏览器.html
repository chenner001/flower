<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cococola Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
        }

        body {
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 顶部导航 */
        .top-nav {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #333;
        }

        .top-nav a {
            color: #333;
            text-decoration: none;
        }

        .top-nav a:hover {
            text-decoration: underline;
        }

        /* LOGO */
        .logo {
            font-size: 60px;
            font-weight: 600;
            color: #1a73e8;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        .logo span {
            color: #ea4335;
        }

        /* 搜索框 */
        .search-box {
            width: 100%;
            max-width: 580px;
            height: 46px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 12px;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.08);
            margin-bottom: 30px;
        }

        .search-box:hover {
            box-shadow: 0 1px 8px rgba(32, 33, 36, 0.15);
            border-color: rgba(223, 225, 229, 0);
        }

        .search-input {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 12px;
        }

        .search-btn {
            padding: 10px 20px;
            background: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            font-size: 14px;
            color: #3c4043;
            cursor: pointer;
        }

        .search-btn:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }

        /* 底部 */
        footer {
            position: absolute;
            bottom: 25px;
            font-size: 13px;
            color: #5f6368;
        }

        /* ========== 新闻弹窗 现代谷歌风格 ========== */
        .news-popup {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 340px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 16px 20px;
            font-size: 15px;
            color: #202124;
            cursor: pointer;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(30px);
            z-index: 999;
        }

        .news-popup.show {
            opacity: 1;
            transform: translateY(0);
        }

        .news-popup:hover {
            box-shadow: 0 6px 24px rgba(0,0,0,0.2);
        }

        .news-title {
            font-weight: 500;
            margin-bottom: 4px;
        }
    </style>
</head>

<body>
    <!-- 顶部导航 -->
    <div class="top-nav">
        <a href="#">首页</a>
        <a href="#">图片</a>
        <a href="#">设置</a>
    </div>

    <!-- LOGO -->
    <div class="logo">coco<span>cola</span></div>

    <!-- 搜索框 -->
    <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="在此输入搜索内容">
    </div>

    <!-- 按钮 -->
    <div class="btn-group">
        <button class="search-btn" id="searchBtn">Cococola 搜索</button>
        <button class="search-btn" id="luckyBtn">手气不错</button>
    </div>

    <!-- 底部 -->
    <footer>Cococola Browser © 现代版</footer>

    <!-- 新闻弹窗 -->
    <div class="news-popup" id="popup">
        <div class="news-title">突发研究新闻</div>
        高桥理惠教授第六次申请进入落花神社内部开展实地研究
    </div>

    <script>
        // 新闻弹窗：2秒后缓缓弹出，点击打开高桥理惠.html
        setTimeout(() => {
            document.getElementById('popup').classList.add('show');
        }, 2000);

        document.getElementById('popup').addEventListener('click', () => {
            window.open('高桥理惠.html', '_blank');
        });

        // 搜索功能
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const luckyBtn = document.getElementById('luckyBtn');

        // 关键词映射
        const keywordMap = {
            '望月大学': '望月大学.html',
            '陈洛': '陈洛.html',
            '黑衣女人': '神乐舞.html'
        };

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (keyword === '') return;
            const targetUrl = keywordMap[keyword];
            if (targetUrl) {
                window.open(targetUrl, '_blank');
            }
            // 其他关键词无反应
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        });

        // 手气不错按钮：无功能，保持原样（可忽略）
        luckyBtn.addEventListener('click', function() {
            // 什么也不做，或可跳转随机页面，但要求其他不要动，故留空
        });
    </script>
</body>
</html>
