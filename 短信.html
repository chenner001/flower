<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>短信 - 来自落花神社</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .message-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 700px;
            background-color: #e5e5e5;
            background-image: radial-gradient(circle at 25% 40%, rgba(200,200,200,0.2) 2%, transparent 2.5%);
            background-size: 28px 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 0 8px #2c2c2c, 0 0 0 12px #1a1a1a;
            border-radius: 32px;
            overflow: hidden;
        }

        .status-bar {
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 14px;
            padding: 12px 20px 6px;
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 0;
            left: 0;
            backdrop-filter: blur(10px);
            font-weight: 500;
            z-index: 2;
        }

        .sms-area {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .bubble {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 18px 22px;
            max-width: 90%;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 17px;
            line-height: 1.45;
            color: #1c1c1e;
            word-break: break-word;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .sender {
            font-size: 13px;
            color: #007aff;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .message-text {
            margin-top: 4px;
        }

        .timestamp {
            font-size: 11px;
            color: #8e8e93;
            text-align: right;
            margin-top: 8px;
        }

        .black-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease;
            color: white;
            text-align: center;
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.5;
            font-family: "Noto Serif SC", serif;
            flex-direction: column;
            gap: 24px;
        }

        .black-screen.active {
            opacity: 1;
            visibility: visible;
        }

        .black-screen div {
            max-width: 85%;
        }
    </style>
</head>
<body>
<div class="message-container">
    <div class="status-bar">
        <span>9:41</span>
        <span>📶 🔋 100%</span>
    </div>
    <div class="sms-area" id="smsArea">
        <div class="bubble">
            <div class="sender">落花神社 官方</div>
            <div class="message-text">
                林原同学，落花神社诚邀您参加本周末的“红叶祭”特别活动。届时将有神乐舞表演和免费的“心灵疗愈”体验。请务必到场。
            </div>
            <div class="timestamp">刚刚</div>
        </div>
    </div>
</div>

<div id="blackScreenLayer" class="black-screen">
    <div>游戏并未结束——只是你的调查结束了。</div>
    <div style="font-size: 22px; margin-top: 12px;">真正的结局，由你决定。<br>陈洛？林原？</div>
</div>

<script>
    (function() {
        const blackScreen = document.getElementById('blackScreenLayer');
        // 页面停留5秒后黑屏
        setTimeout(() => {
            if (blackScreen) {
                blackScreen.classList.add('active');
            }
            // 黑屏显示2秒后跳转
            setTimeout(() => {
                window.location.href = "落花神社3.html";
            }, 2000);
        }, 5000);
    })();
</script>
</body>
</html>
