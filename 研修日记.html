    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "SimSun", "Microsoft YaHei", serif;
        }

        body {
            background-image: url('https://images.unsplash.com/photo-1528360983277-13d401cdc186?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=100');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #222;
            line-height: 1.8;
        }

        .header {
            width: 100%;
            background-color: rgba(255,255,255,0.92);
            padding: 18px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .nav {
            display: flex;
            gap: 36px;
        }

        .nav a {
            text-decoration: none;
            color: #222;
            font-size: 16px;
            transition: opacity 0.2s;
        }

        .nav a:hover {
            opacity: 0.6;
        }

        .container {
            max-width: 1000px;
            margin: 140px auto 80px;
            background-color: rgba(255,255,255,0.88);
            padding: 70px 80px;
        }

        section {
            margin-bottom: 70px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 24px;
            padding-bottom: 10px;
            border-bottom: 1px solid #999;
            font-weight: normal;
        }

        p {
            margin-bottom: 16px;
            font-size: 15px;
            text-align: justify;
        }

        .link-box {
            margin-top: 40px;
            text-align: center;
            font-size: 16px;
        }

        .link-box a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }

        .link-box a:hover {
            text-decoration: underline;
        }

        .footer {
            width: 100%;
            background-color: rgba(255,255,255,0.92);
            text-align: center;
            padding: 24px 0;
            font-size: 14px;
            border-top: 1px solid #ddd;
        }
    </style>
